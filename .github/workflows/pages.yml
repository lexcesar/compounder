name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "compounder/.claude-plugin/plugin.json"
      - "compounder/skills/**"
      - "compounder/agents/**"
      - "compounder/CHANGELOG.md"
      - ".github/scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install cmark-gfm (renders the changelog page)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmark-gfm
      - name: Stamp plugin facts into the page
        run: bash .github/scripts/stamp-site.sh
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
